<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cafe Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="panel" aria-label="Cafe results">
      <header class="panel-head">
        <h1>Cafe Finder</h1>
        <p class="tagline">Live cafes from Open streetMap. FREE!!!</p>
        <p class="tagline">No account needed.</p>

        <form id="searchForm" class="search" role="search">
          <label class="sr-only" for="q">Search a suburb or area</label>
          <input id="q" type="search" placeholder="Try Hatfield, Menlyn or Brooklyn" autocomplete="off">
          <button type="submit" class="btn btn-primary">Search</button>
          <button type="button" id="locateBtn" class="btn">Near me</button>
        </form>

        <div class="filters">
          <label class="chip"><input type="checkbox" id="wifi"> Wi-Fi</label>
          <label class="chip"><input type="checkbox" id="outdoor"> Outdoor seating</label>
          <label class="chip"><input type="checkbox" id="savedOnly"> Saved only</label>
          <label class="select">Sort by
            <select id="sortBy">
              <option value="distance">Distance</option>
              <option value="name">Name</option>
            </select>
          </label>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Loading map…</p>
      </header>
      <ol id="results" class="results"></ol>
    </section>

    <section class="map-wrap" aria-label="Map">
      <div id="map"></div>
      <button id="searchAreaBtn" class="btn btn-primary search-area" hidden>Search this area</button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
